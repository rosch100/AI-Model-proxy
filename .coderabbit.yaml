# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  auto_review:
    enabled: true
    drafts: false
  path_instructions:
    - path: "**/*.py"
      instructions: |
        Prioritize correctness, security, configuration validation, provider routing,
        streaming and SSE behavior, and regression tests. Report only actionable defects.
    - path: ".github/workflows/**"
      instructions: |
        Check action pinning, least-privilege permissions, secret exposure, and
        handling of untrusted pull requests.
