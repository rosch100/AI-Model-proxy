x-build-args: &build_args
  INSTALL_PYTHON_VERSION: "3.13"

services:

  # ── Flask proxy (production mode, gunicorn + supervisord) ──────────────────
  flask:
    build:
      context: .
      target: production
      args:
        <<: *build_args
    image: "cursor-azure-gpt5"
    restart: unless-stopped
    env_file: .env                    # creds loaded at runtime, never baked in
    environment:
      FLASK_ENV: production
      FLASK_DEBUG: "0"
      LOG_LEVEL: ${LOG_LEVEL:-warning}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-1}
      TRUSTED_HOSTS: ${PUBLIC_HOSTNAMES:?Set PUBLIC_HOSTNAMES in .env},localhost,127.0.0.1
      TRUST_PROXY_HEADERS: "true"
    expose:
      - "5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - proxy
    volumes:
      # Mount the host Codex login state into the container user home so token
      # refresh can update auth.json in place across different machines/users.
      - "${HOME}/.codex:/home/sid/.codex"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-proxy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-proxy}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - proxy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      PUBLIC_HOSTNAMES: ${PUBLIC_HOSTNAMES:?Set PUBLIC_HOSTNAMES in .env}
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - proxy
    depends_on:
      flask:
        condition: service_healthy

  # ── Dev / management helpers (not started by default) ─────────────────────
  flask-dev:
    build:
      context: .
      target: development
      args:
        <<: *build_args
    image: "cursor-azure-gpt5-dev"
    env_file: .env
    ports:
      - "8082:5000"
    volumes:
      - ./:/app
    profiles: ["dev"]

  manage:
    entrypoint: flask
    image: "cursor-azure-gpt5-dev"
    env_file: .env
    stdin_open: true
    tty: true
    volumes:
      - ./:/app
    profiles: ["dev"]

networks:
  proxy:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
